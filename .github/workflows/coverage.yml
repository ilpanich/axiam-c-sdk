name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: gcov/lcov coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev lcov
          pip install --user gcovr

      - name: Configure with coverage
        env:
          CC: gcc
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON -DAXIAM_ENABLE_COVERAGE=ON

      - name: Build & test
        run: |
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Generate coverage report (gcovr → coveralls + text)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # gcc-13's gcov can emit spurious "branch N taken -1" negative hit
          # counts (gcc bug 68080); tolerate them so parsing doesn't abort.
          #
          # Line-coverage gate: 98%. Branch-coverage gate: 84%.
          #
          # History: 96/80 were set 2-3 points under what the Phase D and C2
          # passes achieved, and the contract-1.11 §12/§12.7/§14/§15 port then
          # spent that headroom down to 96.3% / 80.2% — one uncovered line away
          # from failing — because that subsystem checks every allocation and
          # those guards are one-sided by construction.
          #
          # The allocation-guard sweep in tests/test_alloc_failures.c is what
          # reclaimed it: it drives the REAL §12/§14/§15/§20 call graphs through
          # link-time malloc/calloc/realloc interception, so those arms are now
          # executed rather than merely unreachable. Measured on this job's own
          # gcc-13 toolchain after that pass: 99.4% lines, 86.2% branches. The
          # gates sit ~1.4pp and ~2.2pp under those MEASURED numbers, the same
          # margin discipline the previous ratchet used.
          #
          # The still-uncovered lines are failures of primitives this suite
          # cannot induce in-process (HMAC/EVP key load returning NULL, libcurl
          # handle init failing) plus two thread-race telemetry arms. Add the
          # test rather than lowering the number.
          #
          # The §23 OPAQUE port kept that discipline rather than spending the
          # headroom: src/opaque.c is a dlopen() binding to a per-platform
          # release asset no runner has, which in most of the eleven SDKs is
          # simply an uncoverable file. Here tests/opaque_stub.c is built as a
          # real MODULE library exporting the twelve symbols and loaded through
          # AXIAM_OPAQUE_LIBRARY, so resolution, the post-load availability
          # check and the ownership rules run against a genuine dynamic object
          # — src/opaque.c measures 100% lines with no exclusion.
          gcovr --root . --filter 'src/' \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary \
            --fail-under-line 98 \
            --fail-under-branch 84 \
            --coveralls coveralls.json \
            --txt coverage.txt
          echo "----- coverage (src/ logic layer) -----"
          cat coverage.txt

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          file: coveralls.json
          format: coveralls
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
