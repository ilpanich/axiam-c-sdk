name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: gcov/lcov coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev lcov
          pip install --user gcovr

      - name: Configure with coverage
        env:
          CC: gcc
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON -DAXIAM_ENABLE_COVERAGE=ON

      - name: Build & test
        run: |
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Generate coverage report (gcovr → coveralls + text)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # gcc-13's gcov can emit spurious "branch N taken -1" negative hit
          # counts (gcc bug 68080); tolerate them so parsing doesn't abort.
          # Line-coverage gate: 96%. Branch-coverage gate: 80%. Both were
          # ratcheted 2-3 points below what was achieved at the time (99.0% /
          # 82.0%, after the Phase D and C2 passes).
          #
          # THE HEADROOM IS GONE as of the contract-1.11 §12/§12.7/§14/§15 port
          # (achieved 96.3% / 80.2%). That subsystem checks every allocation and
          # those guards are one-sided by construction, so the achievable branch
          # ratio genuinely shifted rather than the tests getting worse. The
          # thresholds are unchanged and still hold — but the next change that
          # adds an uncovered line will fail here, which is the point. Add the
          # test rather than lowering the number.
          gcovr --root . --filter 'src/' \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary \
            --fail-under-line 96 \
            --fail-under-branch 80 \
            --coveralls coveralls.json \
            --txt coverage.txt
          echo "----- coverage (src/ logic layer) -----"
          cat coverage.txt

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coveralls.json
          format: coveralls
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
