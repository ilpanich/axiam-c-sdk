name: docs

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: true

jobs:
  doxygen:
    name: build & publish Doxygen HTML to gh-pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: Generate docs
        run: |
          set -euo pipefail
          # PROJECT_NUMBER is printed in the header of every generated page.
          # Read it from AXIAM_VERSION — the string axiam_version() returns and
          # test_sensitive.c pins — rather than trusting the Doxyfile literal,
          # which the release bump does not touch: it sat at 1.0.0-alpha8 and
          # was published as the version of every beta. Doxygen keeps the LAST
          # assignment of a tag, so appending one overrides the file's own.
          version=$(sed -n 's/^#define AXIAM_VERSION "\(.*\)"$/\1/p' include/axiam/axiam.h)
          if [ -z "$version" ]; then
            echo "::error::could not read AXIAM_VERSION from include/axiam/axiam.h"
            exit 1
          fi
          echo "Documenting $version"
          { cat Doxyfile; echo "PROJECT_NUMBER = $version"; } | doxygen -
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIR=docs/html
          touch "$DIR/.nojekyll"
          cd "$DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: publish from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
