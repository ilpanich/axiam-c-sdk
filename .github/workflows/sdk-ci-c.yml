name: sdk-ci-c

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    name: build & test (${{ matrix.cc }}, C${{ matrix.std }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Two axes. The COMPILER axis (gcc, clang) was already here and is
        # unchanged. The STANDARD axis is new, and is floor + newest: C11 is what
        # CMakeLists.txt declares and every consumer inherits by default, C23 is
        # the newest published standard. C17 is a bug-fix revision of C11 and sits
        # between two green legs.
        #
        # The standard axis matters more in C than the version count suggests,
        # because newer standards REMOVE things rather than only adding them: K&R
        # declarations are gone in C23, bool/true/false became keywords, and an
        # implicit function declaration is an error rather than a warning. None of
        # that is visible from a C11-only build, and a consumer whose own project
        # sets -std=c23 — entirely their prerogative — would otherwise be the first
        # person to compile this SDK that way.
        #
        # tests/test_version_policy.c fails the build if this list, CMakeLists.txt
        # and AXIAM_MIN_C_STANDARD stop agreeing.
        include:
          - cc: gcc
            cxx: g++
            std: 11
          - cc: clang
            cxx: clang++
            std: 11
          - cc: gcc
            cxx: g++
            std: 23
          - cc: clang
            cxx: clang++
            std: 23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        # Examples are built here too, so a public-header change that breaks one
        # fails the merge gate rather than a consumer's first `cmake --build`.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DAXIAM_BUILD_TESTS=ON -DAXIAM_BUILD_EXAMPLES=ON
          -DCMAKE_C_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    # §13.4 observation 10 / §12.6.1. OBS-4 was a signed-integer overflow (UB)
    # on the token-decode path in the C++ SDK that survived three security
    # passes because neither C repo had a sanitizer job — the only legs were
    # gcc/clang builds plus coverage, and UB is exactly what an ordinary build
    # does not report. Both suites already pass cleanly under these tools, so
    # this job costs a few minutes and closes the class.
    name: ASan+UBSan & valgrind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev valgrind

      # -fno-sanitize-recover=all is load-bearing: without it UBSan prints a
      # diagnostic and carries on, so the run stays green and the finding is
      # only visible to whoever reads the log. Aborting makes it a gate.
      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (ASan + UBSan)
        run: cmake --build build-asan -j

      - name: Test under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

      - name: Configure (plain, for valgrind)
        run: cmake -S . -B build-vg -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON

      - name: Build (plain)
        run: cmake --build build-vg -j

      # valgrind is run over the test binaries directly rather than through
      # ctest, because this project uses enable_testing() rather than
      # include(CTest) and so has no MemoryCheckCommand wiring. The PKI fixture
      # must therefore be generated first and its directory passed as argv[1] —
      # the crypto/TLS tests take it there, and without it they fail on a
      # missing ca.crt rather than on anything valgrind found.
      - name: Generate the PKI fixture
        run: ctest --test-dir build-vg -R gen_pki --output-on-failure

      - name: Valgrind sweep over every test binary
        working-directory: build-vg
        run: |
          set -euo pipefail
          failures=0
          for t in tests/test_*; do
            [ -x "$t" ] || continue
            echo "::group::valgrind $t"
            if ! valgrind --error-exitcode=9 --leak-check=full \
                 --errors-for-leak-kinds=definite -q "$t" "$PWD/tests/pki"; then
              echo "::error::valgrind reported errors or definite leaks in $t"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::valgrind failed for $failures test binaries"
            exit 1
          fi
          echo "valgrind sweep clean"

  management-drift-check:
    name: §27 management surface drift-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The §27 surface -- 145 model structs, 146 flat operations and four generated test
      # files, ~24k lines -- is produced by scripts/gen_management.py from the VENDORED
      # management-registry.json and openapi.json, and the output is committed so a
      # consumer never needs Python to build this library.
      #
      # Committed generated code is only trustworthy if something checks it is current.
      # The registry is maintained in ilpanich/axiam and re-vendored here; without this
      # gate a re-vendor that adds an operation would leave the SDK shipping a surface
      # that disagrees with the contract it claims to implement -- and every test would
      # still pass, because the tests are generated from the same stale copy.
      #
      # Deliberately installs nothing: the generator imports only the standard library,
      # and ubuntu-24.04 ships a python3 new enough to run it.
      - name: Verify the committed §27 surface matches the vendored contract
        run: |
          python3 --version
          python3 scripts/gen_management.py --check

  tls-bypass-gate:
    name: TLS-bypass lint gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Fail on any TLS-verification bypass (CONTRACT §6)
        run: |
          set -e
          if grep -rnE 'CURLOPT_SSL_VERIFYPEER[^\n]*0|CURLOPT_SSL_VERIFYHOST[^\n]*0' \
                src/ include/ tests/; then
            echo "::error::TLS verification bypass detected — prohibited by CONTRACT §6"
            exit 1
          fi
          echo "No TLS-bypass patterns found."
      - name: Fail on committed private keys
        run: |
          set -e
          if grep -rnE 'BEGIN (RSA |EC )?PRIVATE KEY' \
                --include='*.c' --include='*.h' --include='*.md' . \
                | grep -v third_party; then
            echo "::error::Committed private key material detected"
            exit 1
          fi
          echo "No committed private keys."

  recipes:
    name: package recipes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev python3-pip
          pipx install conan || pip install --user conan

      - name: Validate vcpkg manifest JSON
        run: python3 -c "import json; json.load(open('ports/axiam-c-sdk/vcpkg.json'))"

      - name: Conan create (builds the recipe)
        run: |
          conan profile detect --force
          # Do not pass --version: conanfile.py already declares the version
          # (the single source of truth). Passing a literal here drifts out of
          # sync on every bump and makes conan abort with a version mismatch.
          conan create . --build=missing

  verify-tag-on-main:
    name: verify tag is on main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Ensure tag commit is reachable from main
        run: |
          set -e
          git fetch origin main --depth=200
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Tag commit is on main."
          else
            echo "::error::Tag ${{ github.ref_name }} is not on main"
            exit 1
          fi

  release:
    name: release tarball
    needs: [build-test, tls-bypass-gate, verify-tag-on-main]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # attach the tarball to the GitHub Release
      id-token: write        # mint the Sigstore OIDC identity for provenance
      attestations: write    # write the attestation to this repo's store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev
      - name: Build & package (CPack .tar.gz)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAXIAM_BUILD_TESTS=OFF
          cmake --build build -j
          cd build && cpack -G TGZ
      # T-148 / H-1: a build-provenance attestation over the exact bytes
      # attached below, so an integrator can prove where the tarball came from:
      #
      #   gh attestation verify axiam-c-sdk-<version>.tar.gz --repo ilpanich/axiam-c-sdk
      #
      # Deliberately BEFORE the upload: a release that cannot be attested should
      # not exist, and the alternative — attest afterwards — leaves a published
      # asset with no provenance whenever the attestation step fails.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: build/*.tar.gz

      - name: Attach tarball to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: build/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
