# .github/dependabot.yml
# Automated dependency updates. Mirrors the AXIAM monorepo and the TypeScript
# SDK: weekly on Monday, minor and patch bumps grouped into a single PR so the
# CI matrix runs once per batch; majors arrive one per PR to be reviewed alone.
version: 2
updates:
  # Native dependencies (libcurl, OpenSSL) are resolved by the consumer's
  # package manager (vcpkg / Conan / system packages), not pinned by a lockfile
  # here, so there is nothing for Dependabot to bump: the vcpkg manifest carries
  # no `builtin-baseline`. Their advisories are covered by CodeQL (c-cpp) and the
  # sanitizer/valgrind CI jobs. Only the workflow actions are updated below.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
